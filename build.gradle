plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'top.ilay'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
    externalUrl = 'http://localhost:8091'
}

haloPlugin {
    openApi {
        useExistingServer = true
        groupingRules {
            siteNotifications {
                displayName = 'Site Notifications API'
                pathsToMatch = ['/apis/console.api.site-notifications.halo.run/v1alpha1/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/siteNotifications': 'site-notifications.json']
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('check') {
    dependsOn project(':ui').tasks.named('check')
}

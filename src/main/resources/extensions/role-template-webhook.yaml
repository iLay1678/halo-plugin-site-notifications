apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-site-notifications-webhook
  labels:
    halo.run/role-template: "true"
    halo.run/hidden: "true"
    rbac.authorization.halo.run/aggregate-to-authenticated: "true"
rules:
  - apiGroups: ["api.site-notifications.halo.run"]
    resources: ["webhook"]
    verbs: ["get", "list", "update", "delete"]

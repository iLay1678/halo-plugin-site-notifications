# Refer https://docs.halo.run/developer-guide/plugin/basics/manifest
apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: halo-plugin-site-notifications
spec:
  enabled: true
  requires: ">=2.26.0"
  author:
    name: ilay
    website: https://github.com/ilay1678
  logo: logo.svg
  homepage: https://github.com/ilay1678/halo-plugin-site-notifications#readme
  repo: https://github.com/ilay1678/halo-plugin-site-notifications
  issues: https://github.com/ilay1678/halo-plugin-site-notifications/issues
  displayName: "站内通知"
